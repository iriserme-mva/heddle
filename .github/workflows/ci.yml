name: weft

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libasound2-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev

      - name: Configure (Windows – MSVC)
        if: runner.os == 'Windows'
        # windows-latest is the windows-2025-vs2026 image: ships VS 2026 +
        # CMake 4.4.x (has the "Visual Studio 18 2026" generator); no VS 2022.
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DWEFT_BUILD_HOST=ON

      - name: Configure (Linux / macOS – Ninja)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWEFT_BUILD_HOST=ON

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --target weft_smoke weft_smoke_plugin_VST3 weft-render --verbose

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --target weft_smoke weft_smoke_plugin_VST3 weft-render -v

      - name: Locate built VST3 plugin
        id: loc
        shell: bash
        run: |
          # Plugin output layout (see _juce_configure_bundle):
          #   win (VS gen): build/PlugIns/*_artefacts/Release/VST3/<Product>.vst3 (dir)
          #   lin:          build/PlugIns/*_artefacts/VST3/<Product>.vst3 (dir)
          #   mac:          build/PlugIns/*_artefacts/VST3/<Product>.vst3/Contents/Resources/moduleinfo.json
          find build \( -name 'moduleinfo.json' -o -name 'WeftSmokePlugin.vst3' \) > plugin_hits.txt
          if [ ! -s plugin_hits.txt ]; then
            echo "::error::no VST3 plugin artefact found under build/"
            exit 1
          fi
          hit=$(head -n1 plugin_hits.txt)
          if [ -d "$hit" ]; then
            vst3="$hit"                                   # win/linux: .vst3 is the bundle dir
          else
            vst3=$(cd "$hit/../../.." && pwd)             # mac: moduleinfo.json -> up 3 = bundle
          fi
          [ -d "$vst3" ] || { echo "::error::plugin dir missing: $vst3"; exit 1; }
          echo "path=$vst3" >> "$GITHUB_OUTPUT"
          echo "plugin at: $vst3"

      - name: Smoke (load plugin, dump params, verify plugin params)
        shell: bash
        run: |
          # Binary layout:
          #   win (VS gen): build/Release/weft_smoke.exe
          #   lin/mac:      build/weft_smoke
          smoke=$(find build -name 'weft_smoke' -o -name 'weft_smoke.exe' | head -n1)
          [ -n "$smoke" ] && [ -x "$smoke" ] || { echo "::error::smoke binary not found"; exit 1; }
          "$smoke" "${{ steps.loc.outputs.path }}" > smoke_out.json
          cat smoke_out.json
          python3 - <<'EOF'
          import json
          d = json.load(open("smoke_out.json"))
          assert d["pluginName"] == "WeftSmokePlugin", d["pluginName"]
          names = {p["title"] for p in d["params"]}
          # The VST3 wrapper (JUCE, plugin side) auto-injects a standard
          # "Bypass" param (id 'byps' = 0x62797073), so the host reports the
          # plugin's own params PLUS that injected one. Require the two real
          # params to be present with correct values; tolerate injected extras
          # (Bypass is a JUCE-injected bool, stepCount 2).
          assert {"Gain", "PWM pct"} <= names, names
          gp = next(p for p in d["params"] if p["title"] == "Gain")
          pw = next(p for p in d["params"] if p["title"] == "PWM pct")
          # VST3 params are float32, so compare the defaults with a tolerance,
          # not exact ==. Both params are continuous (stepCount 0): "PWM pct"
          # is a continuous 0..1 duty cycle (the title carries the percent
          # meaning), NOT a stepped choice — a stepped NormalisableRange would
          # surface a non-zero stepCount here and fail the test.
          assert gp["stepCount"] == 0 and abs(gp["defaultValue"] - 1.0) < 1e-5, gp
          assert pw["stepCount"] == 0 and abs(pw["defaultValue"] - 1.0) < 1e-5, pw
          print("SMOKE OK")
          EOF

      - name: Render (offline audio->audio; verify config params + curves reach the plugin)
        shell: bash
        run: |
          # The renderer must run the VST3 through the offline path at the
          # input file's sample rate, with the config's `params:` block pushed
          # onto the live instance. We prove the latter with a GAIN RATIO:
          # the plugin's DSP is out = in * Gain * gate, where gate is a
          # fixed-period (1024-sample) on/off square wave whose duty cycle is
          # the "PWM pct" param. For a constant-amplitude input the mean
          # output / mean input ratio is exactly Gain * duty. Both config
          # values below are NON-defaults (plugin defaults are 1.0 / 1.0): if
          # either were ignored the ratio would be 0.5 (duty ignored) or
          # 0.625 (Gain ignored), not 0.3125.
          render=$(find build -name 'weft-render' -o -name 'weft-render.exe' | head -n1)
          [ -n "$render" ] && [ -x "$render" ] || { echo "::error::weft-render binary not found"; exit 1; }

          # Deterministic input WAV (2048-frame stereo 44100 Hz 16-bit, constant
          # 0.5) + a one-slot chain config with Gain=0.5 and "PWM pct"=0.625
          # pointing at the built VST3 bundle located by the 'loc' step.
          # The plugin's gate period is 1024 samples, so the 2048-frame file
          # is exactly two full periods: duty 0.625 -> 640 of 1024 samples ON
          # per period, and mean(out)/mean(in) = 0.5 * 0.625 = 0.3125.
          python3 - "${{ steps.loc.outputs.path }}" <<'PYEOF'
          import json, struct, sys
          plugin = sys.argv[1]
          RATE, CH, N, BITS = 44100, 2, 2048, 16
          val = int(round(0.5 * 32768))            # 16384 -> 0.5 tone
          data = b"".join(struct.pack("<h", val) for _ in range(N * CH))
          byte_rate = RATE * CH * (BITS // 8)
          with open("in.wav", "wb") as f:
              f.write(b"RIFF" + struct.pack("<I", 36 + len(data)) + b"WAVE")
              f.write(b"fmt " + struct.pack("<I", 16))
              f.write(struct.pack("<HHIIHH", 1, CH, RATE, byte_rate,
                                   CH * (BITS // 8), BITS))
              f.write(b"data" + struct.pack("<I", len(data)) + data)
          cfg = {"sample_rate": RATE, "block_size": 512,
                 "chain": [{"id": "gain", "plugin": plugin,
                            "enabled": True,
                            "params": {"Gain": 0.5, "PWM pct": 0.625}}]}
          with open("render_chain.json", "w") as f:
              json.dump(cfg, f)
          # Curve form: Gain ramps 0.5 -> 1.0 over the full 2048-frame file,
          # gate wide open ("PWM pct" = 1.0, duty = 1.0 -> never gates).
          cfg2 = {"sample_rate": RATE, "block_size": 512,
                  "chain": [{"id": "gain", "plugin": plugin,
                             "enabled": True,
                             "params": {"Gain": {"curve": [[0, 0.5], [2048, 1.0]]},
                                        "PWM pct": 1.0}}]}
          with open("render_curve.json", "w") as f:
              json.dump(cfg2, f)
          print("render config plugin =", plugin)
          PYEOF

          "$render" in.wav render_chain.json out.wav --bits 16 || { echo "::error::weft-render failed"; exit 1; }

          # Verify: output is 2048 frames / 44100 Hz / stereo / 16-bit PCM, and
          # the gain ratio out/in is 0.3125 (= configured Gain 0.5 x
          # configured "PWM pct" 0.625 — the gate is exactly half-ish ON per
          # 1024-sample period, and the 2048-frame file holds 2 full periods).
          # If either config param were ignored the ratio would be 0.5 or
          # 0.625; if BOTH were ignored (defaults 1.0/1.0) it would be 1.0.
          python3 - <<'PYEOF'
          import struct

          def parse16(path):
              raw = open(path, "rb").read()
              assert raw[:4] == b"RIFF" and raw[8:12] == b"WAVE", raw[:12]
              pos, fmt, data = 12, None, None
              while pos + 8 <= len(raw):
                  cid = raw[pos:pos + 4]
                  size = struct.unpack("<I", raw[pos + 4:pos + 8])[0]
                  body = raw[pos + 8:pos + 8 + size]
                  if cid == b"fmt ":
                      fmt = body
                  elif cid == b"data":
                      data = body
                      break
                  pos += 8 + size + (size & 1)
              assert fmt is not None and data is not None, (path, "chunks")
              ch   = struct.unpack("<H",  fmt[2:4])[0]
              rate = struct.unpack("<I",  fmt[4:8])[0]
              bits = struct.unpack("<H",  fmt[14:16])[0]
              n = len(data) // 2
              return ch, rate, bits, struct.unpack("<%dh" % n, data)

          ich, irate, ibits, in_s  = parse16("in.wav")
          och, orate, obits, out_s = parse16("out.wav")
          assert (och, orate, obits) == (2, 44100, 16), (och, orate, obits)
          assert len(out_s) // och == 2048, len(out_s) // och
          in_mean  = sum(in_s)  / len(in_s)
          out_mean = sum(out_s) / len(out_s)
          gain = out_mean / in_mean
          print(f"input mean {in_mean:.2f}  output mean {out_mean:.2f}  gain {gain:.4f}")
          assert abs(gain - 0.3125) < 0.01, gain   # 0.5 (Gain) * 0.625 (PWM pct)
          print("RENDER OK")
          PYEOF

          # ---- curve case --------------------------------------------------
          # Gain ramps 0.5 -> 1.0 over the whole 2048-frame file. At each
          # 512-frame block start the curve evaluates to 0.5, 0.625, 0.75,
          # 0.875, and the plugin applies that gain per block (it reads the
          # param live in processBlock). "PWM pct" is held at 1.0 (gate wide
          # open), so it cannot mask a failure. Mean gain = 0.6875. If curve
          # automation were ignored — stuck at the load-time value (0.5) or at
          # the last value (1.0) — the mean would be 0.5 or 1.0, not 0.6875.
          "$render" in.wav render_curve.json out_curve.wav --bits 16 || { echo "::error::weft-render (curve) failed"; exit 1; }

          python3 - <<'PYEOF'
          import struct

          def parse16(path):
              raw = open(path, "rb").read()
              assert raw[:4] == b"RIFF" and raw[8:12] == b"WAVE", raw[:12]
              pos, fmt, data = 12, None, None
              while pos + 8 <= len(raw):
                  cid = raw[pos:pos + 4]
                  size = struct.unpack("<I", raw[pos + 4:pos + 8])[0]
                  body = raw[pos + 8:pos + 8 + size]
                  if cid == b"fmt ":
                      fmt = body
                  elif cid == b"data":
                      data = body
                      break
                  pos += 8 + size + (size & 1)
              assert fmt is not None and data is not None, (path, "chunks")
              ch   = struct.unpack("<H",  fmt[2:4])[0]
              rate = struct.unpack("<I",  fmt[4:8])[0]
              bits = struct.unpack("<H",  fmt[14:16])[0]
              n = len(data) // 2
              return ch, rate, bits, struct.unpack("<%dh" % n, data)

          och, orate, obits, out_s = parse16("out_curve.wav")
          assert (och, orate, obits) == (2, 44100, 16), (och, orate, obits)
          assert len(out_s) // och == 2048, len(out_s) // och
          out_mean = sum(out_s) / len(out_s)
          gain = out_mean / 16384.0   # input is the constant 0.5 tone (16384)
          print(f"curve output mean {out_mean:.2f}  mean gain {gain:.4f}")
          assert abs(gain - 0.6875) < 0.01, gain   # (0.5+0.625+0.75+0.875)/4
          print("RENDER CURVE OK")
          PYEOF
